[project]
name = "yfinance-agent-mcp"
version = "0.1.0"
description = "Read-only yfinance MCP server for AI trading-research agents: quotes, price history, news, screeners, fundamentals, options and live prices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikolay Kostadinov" }]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "yfinance",
    "yahoo-finance",
    "stock-market",
    "market-data",
    "finance",
    "trading",
    "stocks",
    "options",
    "financial-news",
    "ai-agents",
    "llm",
    "claude",
    "uvx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "platformdirs>=4.0",
    "yfinance>=1.8.0,<2",
]

[project.urls]
Homepage = "https://n-kostadinov.github.io/yfinance-agent-mcp/"
Documentation = "https://n-kostadinov.github.io/yfinance-agent-mcp/"
Repository = "https://github.com/n-kostadinov/yfinance-agent-mcp"
Issues = "https://github.com/n-kostadinov/yfinance-agent-mcp/issues"
Changelog = "https://github.com/n-kostadinov/yfinance-agent-mcp/blob/main/CHANGELOG.md"

[project.scripts]
yfinance-agent-mcp = "yfinance_agent_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.9"

[dependency-groups]
dev = [
    "anyio>=4.9",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "zensical>=0.1.3,<0.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "RET", "N", "PIE"]
# Error classes use domain names (RateLimited, NotFound) rather than an "Error" suffix.
ignore = ["N818"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not live"]
markers = ["live: calls the real Yahoo Finance service over the network"]

[tool.coverage.run]
source = ["yfinance_agent_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Enforced whenever coverage is measured: `uv run pytest --cov`.
fail_under = 85
