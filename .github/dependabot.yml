version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # yfinance-update.yml adopts new yfinance releases and releases them.
    ignore:
      - dependency-name: yfinance
    groups:
      python:
        patterns: ["*"]
