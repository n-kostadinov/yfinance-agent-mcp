name: Live tests

# The live tests call Yahoo Finance. They run nightly and on demand rather than on pull
# requests, so Yahoo's availability or throttling never blocks a change.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # yfinance-update.yml runs the live tests against the commit it wants to release.
  workflow_call:
    inputs:
      ref:
        description: Commit to test; empty means the commit that triggered the run
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  UV_VERSION: "0.13.9"

jobs:
  live:
    name: Live tests against Yahoo Finance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install the project
        run: uv sync --locked

      - name: Live tests
        run: uv run pytest -m live -v
